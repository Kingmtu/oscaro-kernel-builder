name: Build oscaro LineageOS 24.0 KSU + SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    name: Build oscaro (lineage-24.0)
    runs-on: ubuntu-22.04

    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison gperf \
            build-essential zip curl zlib1g-dev libssl-dev libxml2-utils \
            xsltproc bc rsync libncurses5-dev python3 libelf-dev dwarves pahole \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup LineageOS Clang (LLVM) Toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b clang

      - name: Clone oscaro lineage-24.0 Kernel Source
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_oneplus_sm6375 -b lineage-24.0 kernel-source

      - name: Integrate SukiSU-Ultra (Pre-integrated SUSFS for 5.4)
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

      - name: Apply SUSFS 5.4 Kernel Patches
        run: |
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu -b kernel-5.4 susfs
          cd kernel-source
          cp -r ../susfs/kernel_patches/fs/* ./fs/
          cp -r ../susfs/kernel_patches/include/linux/* ./include/linux/

          # Apply main SUSFS 5.4 patch (ignore exit code 1 from missing bootconfig.c)
          patch -p1 --forward --batch < ../susfs/kernel_patches/50_add_susfs_in_kernel-5.4.patch || true

          # Fix Hunk #1 reject in fs/proc/task_mmu.c (inject missing susfs_def.h header)
          sed -i '1i #ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif' fs/proc/task_mmu.c

          # Fix Hunk #1 reject in include/linux/mount.h (inject susfs_mnt_id_backup into struct vfsmount)
          sed -i '/struct vfsmount {/a #ifdef CONFIG_KSU_SUSFS\n\tu64 susfs_mnt_id_backup;\n#endif' include/linux/mount.h

          # Clean up .rej and .orig files
          find . -name "*.rej" -delete
          find . -name "*.orig" -delete

      - name: Bypass Module Vermagic Check (Prevents Broken Wi-Fi/Audio)
        run: |
          cd kernel-source
          sed -i 's/!same_magic(modmagic, vermagic, info->index.vers)/0/' kernel/module.c
          sed -i 's/return -ENOEXEC;/\/\* bypassed \*\//' kernel/module.c || true

      - name: Enable KSU, SUSFS & Module Force-Load in Defconfig
        run: |
          cd kernel-source
          cat << 'EOF' >> arch/arm64/configs/vendor/holi-qgki_defconfig
          CONFIG_MODULES=y
          CONFIG_MODULE_FORCE_LOAD=y
          CONFIG_MODVERSIONS=n
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          EOF

      - name: Compile Kernel with Full LLVM
        run: |
          cd kernel-source
          export PATH="$(pwd)/../clang/bin:$PATH"
          
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            vendor/holi-qgki_defconfig

          # Compile on all cores; if an error occurs, re-run with -j1 so the exact error is shown at the bottom of the log
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            Image || make -j1 O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            Image

      - name: Package Flashable AnyKernel3 Zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          sed -i 's/device.name1=.*/device.name1=oscaro/' AnyKernel3/anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' AnyKernel3/anykernel.sh
          sed -i 's|BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|BLOCK=auto;|' AnyKernel3/anykernel.sh
          cp kernel-source/out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 ../AnyKernel3-oscaro-lineage24.0-KSU-SUSFS.zip * -x .git README.md *placeholder

      - name: Upload Compiled Kernel
        uses: actions/upload-artifact@v4
        with:
          name: oscaro-lineage24.0-ksu-susfs
          path: AnyKernel3-oscaro-lineage24.0-KSU-SUSFS.zip
