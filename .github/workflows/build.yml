name: Build Oscaro Custom Kernel with SukiSU

on:
  workflow_dispatch: # Allows manual trigger via the GitHub UI

jobs:
  build:
    name: Build Kernel for OnePlus Nord CE 2 Lite 5G
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -v"
      CCACHE_FLEX_MODULES: "1"
      ARCH: arm64
      SUBARCH: arm64

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git gnupg gperf libelf-dev libssl-dev lz4 liblz4-tool lzop rsync libxml2-utils zip unzip
          sudo apt-get clean

      - name: Download AOSP Clang Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang
          # Direct archive download link from the official Google AOSP Prebuilts Git Server
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2022/clang-r450784d.tar.gz
          tar -xf clang-r450784d.tar.gz
          rm clang-r450784d.tar.gz

      - name: Clone LineageOS Oscaro Kernel Source
        run: |
          git clone --depth=1 https://github.com -b lineage-22.1 $GITHUB_WORKSPACE/kernel-src

      - name: Patch SukiSU-Ultra & SUSFS
        run: |
          cd $GITHUB_WORKSPACE/kernel-src
          # Pull and inject SukiSU setup natively into the 5.4 build system
          curl -LSs "https://sukisu.org" | bash -s main
          
          # Inject configurations directly into the target defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/sm6375_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/vendor/sm6375_defconfig
          echo "CONFIG_KSU_KPM=y" >> arch/arm64/configs/vendor/sm6375_defconfig

      - name: Compile Custom Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel-src
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # First, configure the defconfig target
          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-android- vendor/sm6375_defconfig
          
          # Execute the parallel build using available CPU cores
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-android-

      - name: Package Output Binaries
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          if [ -f $GITHUB_WORKSPACE/kernel-src/out/arch/arm64/boot/Image.gz ]; then
            cp $GITHUB_WORKSPACE/kernel-src/out/arch/arm64/boot/Image.gz $GITHUB_WORKSPACE/output/
            echo "Kernel built successfully!"
          elif [ -f $GITHUB_WORKSPACE/kernel-src/out/arch/arm64/boot/Image ]; then
            cp $GITHUB_WORKSPACE/kernel-src/out/arch/arm64/boot/Image $GITHUB_WORKSPACE/output/
            echo "Kernel built successfully!"
          else
            echo "Kernel compilation failed! Output binary missing."
            exit 1
          fi

      - name: Upload Flashable Kernel Binary
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Kernel-Oscaro
          path: ${{ github.workspace }}/output/*
